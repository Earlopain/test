name: Test
on: push

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version: [ruby, jruby, truffleruby]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - version: truffleruby
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.version }}
    - run: ruby -ve 'path = File.join(Dir.home, "\u{3042 3044 3046 3048 304a}.rb".encode(Encoding::Windows_31J)); File.write(path, "ok")'
    - run: ruby -ve 'pp Dir["#{Dir.home}/*.rb"]'
